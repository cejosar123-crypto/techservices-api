services:
  - type: web
    name: techservices-api
    runtime: java
    plan: free
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/techservices-api-1.0.0.jar
    # Sin healthCheckPath apuntando a /api/clientes/{id}: cada ping de salud
    # descontaria un token. Render no requiere health check.
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # El puerto lo asigna Render con la variable PORT, que application.properties
      # ya lee automaticamente. No es necesario definir SERVER_PORT en la nube.
