# =====================================================
# TechServices Peru - API REST segura (Ejercicio 1)
# =====================================================
# Todas las credenciales se leen de variables de entorno.
# Los valores despues de ":" son SOLO valores de desarrollo local (XAMPP).
#
# Variables requeridas: DB_URL, DB_USERNAME, DB_PASSWORD, SERVER_PORT

# Puerto: primero SERVER_PORT, luego PORT (Render), si no 8080
server.port=${SERVER_PORT:${PORT:8080}}

# Conexion a MySQL (XAMPP local por defecto: root sin contrasena)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_techservices?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA: el esquema lo crea database.sql, Hibernate no modifica nada
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tiempo de espera de conexion (evita colgadas si MySQL no esta encendido)
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=5
